<!DOCTYPE html>
<html>
<head><title>Admin Login</title></head>
<body style="font-family:sans-serif;max-width:400px;margin:50px auto;">
  <h2>Вход в систему</h2>
  {% with messages = get_flashed_messages() %}
    {% if messages %}<p style="color:red">{{ messages[0] }}</p>{% endif %}
  {% endwith %}
  <form method="post">
    <input type="text" name="username" placeholder="Логин" required style="width:100%;padding:10px;margin:5px 0;"><br>
    <input type="password" name="password" placeholder="Пароль" required style="width:100%;padding:10px;margin:5px 0;"><br>
    <button type="submit" style="padding:10px 20px;background:#007bff;color:white;border:none;cursor:pointer;">Войти</button>
  </form>
</body>
</html>
