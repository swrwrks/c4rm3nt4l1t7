<div class="page-wrapper">
    <div class="page-card">
        <h2 class="page-title">Настройки</h2>

        <form id="settings-form" class="compact-form">
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" id="set-phone" placeholder="+7 (999) 000-00-00">
            </div>
            <div class="form-group">
                <label>Новый пароль</label>
                <input type="password" id="set-password" placeholder="Оставьте пустым, если не меняете">
            </div>
            <button type="submit" class="btn-compact btn-primary">💾 Сохранить</button>
        </form>
    </div>
</div>
