<div class="settings-card">
    <h2 class="settings-title">Настройки</h2>

    <form id="settings-form">
        <div class="form-group">
            <label for="old-password">Текущий пароль</label>
            <input type="password" id="old-password" required placeholder="Введите старый пароль">
        </div>

        <div class="form-group">
            <label for="new-password">Новый пароль</label>
            <input type="password" id="new-password" required placeholder="Введите новый пароль">
        </div>

        <button type="submit" id="save-btn" class="btn btn-primary btn-block">
            💾 Сохранить
        </button>
    </form>
</div>
