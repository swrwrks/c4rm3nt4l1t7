<!-- Заголовок страницы (на фоне, как на странице "О нас") -->
<h2>Вход в аккаунт</h2>

<!-- Белая карточка с формами -->
<div class="auth-container">

    <!-- ================= ФОРМА ВХОДА ================= -->
    <div id="login-form-container">
        <form id="login-form">
            <div class="form-group">
                <label for="login-username">Username</label>
                <input
                    type="text"
                    id="login-username"
                    required
                    placeholder="Введите username"
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input
                    type="password"
                    id="login-password"
                    required
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Войти
            </button>
        </form>

        <p class="auth-switch">
            Нет аккаунта?
            <a href="#" id="show-register">Зарегистрироваться</a>
        </p>
    </div>

    <!-- ================= ФОРМА РЕГИСТРАЦИИ ================= -->
    <div id="register-form-container" class="hidden">
        <form id="register-form">
            <div class="form-group">
                <label for="register-username">Username</label>
                <input
                    type="text"
                    id="register-username"
                    required
                    placeholder="Придумайте username"
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="register-email">Email</label>
                <input
                    type="email"
                    id="register-email"
                    required
                    placeholder="mail@example.com"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="register-phone">Телефон (необязательно)</label>
                <input
                    type="tel"
                    id="register-phone"
                    placeholder="+7 (999) 123-45-67"
                    autocomplete="tel"
                >
            </div>

            <div class="form-group">
                <label for="register-password">Пароль</label>
                <input
                    type="password"
                    id="register-password"
                    required
                    placeholder="Придумайте пароль (мин. 6 символов)"
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Зарегистрироваться
            </button>
        </form>

        <p class="auth-switch">
            Уже есть аккаунт?
            <a href="#" id="show-login">Войти</a>
        </p>
    </div>

</div>
