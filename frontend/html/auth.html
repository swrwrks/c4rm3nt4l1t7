<div class="auth-container">
    <!-- Форма входа (без изменений) -->
    <div id="login-form-container">
        <h2>Вход</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
        <p class="auth-switch">
            Нет аккаунта? <a href="#/register" data-link>Зарегистрироваться</a>
        </p>
    </div>

    <!-- Форма регистрации (добавлено поле Email) -->
    <div id="register-form-container" class="hidden">
        <h2>Регистрация</h2>
        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="register-username" required>
            </div>
            <!-- 🆕 Новое поле Email -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="register-email" required placeholder="mail@example.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="register-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>
        <p class="auth-switch">
            Уже есть аккаунт? <a href="#/login" data-link>Войти</a>
        </p>
    </div>
</div>
