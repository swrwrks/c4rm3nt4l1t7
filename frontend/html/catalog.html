<div class="catalog-layout">
    <aside class="filters-panel">
        <h3>Фильтры</h3>
        <div class="filter-group">
            <label>Марка</label>
            <select id="filter-brand">
                <option value="">Все марки</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Цена от</label>
            <input type="number" id="filter-min" placeholder="0">
        </div>
        <div class="filter-group">
            <label>Цена до</label>
            <input type="number" id="filter-max" placeholder="20 000 000">
        </div>
        <div class="filter-group">
            <label>Год выпуска</label>
            <input type="number" id="filter-year" placeholder="Все года">
        </div>
        <div class="filter-group">
            <label>Сортировка</label>
            <select id="filter-sort">
                <option value="default">По умолчанию</option>
                <option value="price_asc">Сначала дешевые</option>
                <option value="price_desc">Сначала дорогие</option>
            </select>
        </div>
        <button id="apply-btn" class="btn btn-primary btn-block">Применить</button>
    </aside>

    <main class="catalog-main">
        <div id="catalog-grid" class="cars-grid"></div>

        <div id="pagination" class="pagination" style="display:none;">
            <button id="prev-page" class="btn-pagination">← Назад</button>
            <span id="page-info">Страница 1</span>
            <button id="next-page" class="btn-pagination">Вперёд →</button>
        </div>
    </main>
</div>
